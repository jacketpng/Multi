name: multi
description: "Multi — a media multi-tool. One GUI for yt-dlp, gallery-dl, aria2, FFmpeg, and ImageMagick."
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  file_selector: ^1.0.3
  archive: ^3.6.1
  html: ^0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
