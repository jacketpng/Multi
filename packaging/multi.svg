<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Multi: two handles splayed into the M's stems, with a blade and a
       cap lifter swung out of them to meet in the middle as the V.
       Every stroke turns about a pin a real multitool would have. -->
  <rect width="128" height="128" rx="28" fill="#1E2230"/>
  <g fill="#E9EDF4" stroke="#1E2230" stroke-width="2.8" stroke-linejoin="round">
    <g transform="translate(95,29) rotate(22.5)">
      <circle r="8.5"/>
      <path d="M -7.5,0 L 7.5,0 L 7.5,33 L 1.8,33 L 1.8,48 L 7.5,48
               L 6.5,64 L 3,79 L -3,79 L -6,54 L -7.5,0 Z"/>
    </g>
    <g transform="translate(33,29) rotate(-22.5)">
      <circle r="8.5"/>
      <path d="M -8,0 L 8,0 L 8,57 C 7.8,68 5.4,77 0.8,83
               C -3,74 -8,64 -8,53 Z"/>
    </g>
    <g transform="translate(33,29) rotate(10.6)">
      <rect x="-11.5" y="-11.5" width="23" height="90" rx="11.5"/>
    </g>
    <g transform="translate(95,29) rotate(-10.6)">
      <rect x="-11.5" y="-11.5" width="23" height="90" rx="11.5"/>
    </g>
  </g>
  <g fill="#1E2230">
    <circle cx="33" cy="29" r="4.2"/>
    <circle cx="95" cy="29" r="4.2"/>
    <g transform="translate(33,29) rotate(10.6)"><circle cy="70.8" r="3.4"/></g>
    <g transform="translate(95,29) rotate(-10.6)"><circle cy="70.8" r="3.4"/></g>
  </g>
</svg>
