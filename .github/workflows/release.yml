name: Release

# Builds Multi for Linux (x64 + arm64), Windows (x64 + arm64) and macOS
# (universal) whenever a version tag is pushed, then attaches everything
# to a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# "Run workflow" in the Actions tab does a test build: artifacts are
# uploaded, but no release is published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true
        default: '0.0.0-test'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  # Never publish a release from code that does not analyze or pass its
  # tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # The stress harnesses need the real tools and real media on the
      # machine, which a runner does not have.
      - run: flutter test --exclude-tags stress

  version:
    runs-on: ubuntu-latest
    needs: check
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------
  # Linux: .deb, .rpm, .AppImage and a portable tarball.
  #
  # x86_64 only: Flutter publishes no arm64 SDK ("Unable to determine
  # Flutter version for ... architecture: arm64"), so an aarch64 job
  # cannot get a toolchain. The packaging scripts do build on aarch64
  # if you run them on an arm machine that has Flutter.
  #
  # Built on the oldest supported Ubuntu because glibc is forward
  # compatible: binaries built against an older glibc run on newer
  # distributions, but not the other way round.
  # ---------------------------------------------------------------
  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev patchelf desktop-file-utils \
            rpm dpkg-dev file zsync

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set version from the tag
        run: |
          sed -i 's/^version: .*/version: ${{ needs.version.outputs.version }}/' pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Build
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        run: |
          set -x
          V='${{ needs.version.outputs.version }}'
          tar -C build/linux/x64/release -czf "multi-$V-linux-x86_64.tar.gz" bundle
          ./packaging/build-deb.sh --skip-build
          ./packaging/build-rpm.sh --skip-build
          ./packaging/build-appimage.sh --skip-build
          cp "$HOME"/rpmbuild/RPMS/*/multi-*.rpm .
          ls -lh multi*.deb multi-*.rpm multi-*.tar.gz Multi-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            multi*.deb
            multi-*.rpm
            multi-*.tar.gz
            Multi-*.AppImage

  # ---------------------------------------------------------------
  # Windows: an Inno Setup installer plus a portable zip.
  #
  # x64 only, for the same reason as Linux: flutter-action cannot fetch
  # an arm64 SDK. Windows on ARM runs x64 binaries under emulation, so
  # the x64 build is usable there in the meantime.
  # ---------------------------------------------------------------
  windows:
    needs: version
    runs-on: windows-latest
    env:
      ARCH: x64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set version from the tag
        shell: bash
        run: |
          sed -i 's/^version: .*/version: ${{ needs.version.outputs.version }}/' pubspec.yaml

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release

      - name: Portable zip
        shell: bash
        run: |
          V='${{ needs.version.outputs.version }}'
          cd "build/windows/${{ env.ARCH }}/runner/Release"
          7z a "$GITHUB_WORKSPACE/multi-$V-windows-${{ env.ARCH }}.zip" ./*

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc `
            "/DMultiVersion=${{ needs.version.outputs.version }}" `
            "/DMultiArch=${{ env.ARCH }}" `
            "/DSourceDir=$PWD\build\windows\${{ env.ARCH }}\runner\Release" `
            "packaging\windows-installer.iss"
          Get-ChildItem packaging\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            multi-*.zip
            packaging/multi-*-setup.exe

  # ---------------------------------------------------------------
  # macOS: one universal (arm64 + x86_64) app in a DMG.
  # ---------------------------------------------------------------
  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set version from the tag
        run: |
          sed -i '' 's/^version: .*/version: ${{ needs.version.outputs.version }}/' pubspec.yaml

      - name: Build
        run: |
          flutter pub get
          flutter build macos --release

      - name: Build DMG
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          APP=build/macos/Build/Products/Release/Multi.app
          BIN="$APP/Contents/MacOS/Multi"
          ARCHS="$(lipo -archs "$BIN")"
          echo "architectures: $ARCHS"

          # Flutter builds macOS release binaries for both slices, but
          # name the file after what is actually in it rather than
          # assuming — an artifact called "universal" that only runs on
          # one architecture would be worse than an honest name.
          if [[ "$ARCHS" == *x86_64* && "$ARCHS" == *arm64* ]]; then
            SUFFIX=universal
          else
            SUFFIX="${ARCHS// /-}"
            echo "::warning::Not a universal binary (got: $ARCHS); naming the DMG $SUFFIX"
          fi

          STAGE="$(mktemp -d)"
          # ditto keeps the bundle's symlinks and permissions intact,
          # which a plain cp -r or zip would flatten.
          ditto "$APP" "$STAGE/Multi.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Multi $V" -srcfolder "$STAGE" \
            -ov -format UDZO "multi-$V-macos-$SUFFIX.dmg"
          shasum -a 256 multi-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: multi-*.dmg

  release:
    # Only a real tag publishes; manual runs stop at the artifacts.
    # always() so that one platform failing still publishes whatever the
    # others produced, instead of losing the whole release.
    if: |
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.version.result == 'success'
    runs-on: ubuntu-latest
    needs: [version, linux, windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          FILES="$(find dist -type f | sort)"
          if [ -z "$FILES" ]; then
            echo "::error::no artifacts were produced - nothing to release"
            exit 1
          fi
          echo "$FILES"
          cat > notes.md <<'NOTES'
          | Platform | Download |
          |---|---|
          | Debian / Ubuntu / Mint | `multi_*_amd64.deb` |
          | Fedora / RHEL / openSUSE | `multi-*.x86_64.rpm` |
          | Any Linux | `Multi-*.AppImage` — `chmod +x` and run |
          | Linux (portable) | `multi-*-linux-x86_64.tar.gz` |
          | Windows | `multi-*-windows-x64-setup.exe` |
          | Windows (portable) | `multi-*-windows-*.zip` |
          | macOS (Intel + Apple Silicon) | `multi-*-macos-universal.dmg` |

          x86_64 / Intel only on Linux and Windows: Flutter publishes no
          arm64 SDK for either. Windows on ARM runs the x64 build under
          emulation. The macOS DMG is universal, so it is native on both
          Apple Silicon and Intel.

          The Windows and macOS builds are unsigned. macOS quarantines
          unsigned apps: right-click and choose Open, or run
          `xattr -dr com.apple.quarantine /Applications/Multi.app`.

          Multi downloads yt-dlp, gallery-dl, aria2, FFmpeg and
          ImageMagick itself on first launch — nothing else to install.
          NOTES
          # Idempotent: re-running a tag after fixing CI must update the
          # existing release rather than failing with "already exists".
          if gh release view "$GITHUB_REF_NAME" \
               --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - updating it"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Multi $VERSION" \
              --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber $FILES
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Multi $VERSION" \
              --notes-file notes.md \
              $FILES
          fi
